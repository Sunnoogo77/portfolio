name: Deploy portfolio (Vite)

# La branche dev porte la refonte et se publie sur le meme site Pages, afin de
# pouvoir juger le rendu avant de fusionner. Pendant la revue, ne pousser que
# sur dev : le dernier envoi publie gagne.
on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: secure-identity-portfolio-main/package-lock.json

      - name: Install dependencies
        working-directory: secure-identity-portfolio-main
        run: npm ci

      - name: Lint
        working-directory: secure-identity-portfolio-main
        run: npm run lint

      - name: Typecheck
        working-directory: secure-identity-portfolio-main
        run: npm run typecheck

      - name: Test
        working-directory: secure-identity-portfolio-main
        run: npm run test

      - name: Build
        working-directory: secure-identity-portfolio-main
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: secure-identity-portfolio-main/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
